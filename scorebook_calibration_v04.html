const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),loupe=$('loupe');let img=new Image(),w=0,h=0,frames=[],s=1,ox=0,oy=0,base=1,contacts=new Map(),drag=null,gesture=null;const initial=[[[0.31553339173433054,0.057353316036112226],[0.9624696866458298,0.057353316036112226],[0.9624696866458298,0.46304722311948654],[0.31553339173433054,0.46304722311948654]],[[0.32012375876947824,0.5672579149821747],[0.9763603511324143,0.5672579149821747],[0.9763603511324143,0.9818743004515174],[0.32012375876947824,0.9818743004515174]]];function reset(){frames=initial.map(f=>f.map(([x,y])=>({x:x*w,y:y*h})));draw()}function fit(){if(!w)return;base=s=Math.min(cv.width/w,cv.height/h);ox=(cv.width-w*s)/2;oy=(cv.height-h*s)/2;draw()}function resize(){let r=cv.getBoundingClientRect();cv.width=Math.round(r.width);cv.height=Math.round(r.height);fit()}function project(p,u,v){let [a,b,c,d]=p,dx1=b.x-c.x,dx2=d.x-c.x,dx3=a.x-b.x+c.x-d.x,dy1=b.y-c.y,dy2=d.y-c.y,dy3=a.y-b.y+c.y-d.y,det=dx1*dy2-dx2*dy1,g=det?(dx3*dy2-dx2*dy3)/det:0,k=det?(dx1*dy3-dx3*dy1)/det:0,z=1+g*u+k*v;return{x:(a.x+(b.x-a.x+g*b.x)*u+(d.x-a.x+k*d.x)*v)/z,y:(a.y+(b.y-a.y+g*b.y)*u+(d.y-a.y+k*d.y)*v)/z}}function line(a,b,color){ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);if(!w)return;ctx.setTransform(s,0,0,s,ox,oy);ctx.drawImage(img,0,0,w,h);ctx.lineWidth=1.2/s;for(let f of frames){for(let i=0;i<=10;i++)line(project(f,0,i/10),project(f,1,i/10),'#0088ff');for(let i=0;i<=9;i++)line(project(f,i/9,0),project(f,i/9,1),'#ff3333')}ctx.setTransform(1,0,0,1,0,0);frames.forEach((f,j)=>f.forEach((p,i)=>{let x=p.x*s+ox,y=p.y*s+oy;ctx.fillStyle=j?'#e68a00':'#007aff';ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText((j?'下':'上')+(i+1),x,y+4)}));if(drag&&drag.i>=0){let p=frames[drag.f][drag.i],l=loupe.getContext('2d'),z=s*4;loupe.style.display='block';loupe.style.top=p.y*s+oy<140?'auto':'5px';loupe.style.bottom=p.y*s+oy<140?'5px':'auto';l.clearRect(0,0,220,220);l.drawImage(img,110-p.x*z,110-p.y*z,w*z,h*z);l.strokeStyle='red';l.beginPath();l.moveTo(110,0);l.lineTo(110,220);l.moveTo(0,110);l.lineTo(220,110);l.stroke()}else loupe.style.display='none'}function pos(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function inside(f,p){return f.every((a,i)=>{let b=f[(i+1)%4];return (b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x)>=0})}function pair(){let [a,b]=contacts.values();return{x:(a.x+b.x)/2,y:(a.y+b.y)/2,d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))}}function zoom(f,x,y){let n=Math.max(base*.7,Math.min(base*12,s*f)),r=n/s;ox=x-(x-ox)*r;oy=y-(y-oy)*r;s=n}cv.onpointerdown=e=>{if(!w)return;e.preventDefault();let p=pos(e);contacts.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);if(contacts.size===2){drag=null;gesture=pair();draw();return}if(contacts.size!==1)return;let best=25;drag=null;frames.forEach((f,j)=>f.forEach((q,i)=>{let d=Math.hypot(q.x*s+ox-p.x,q.y*s+oy-p.y);if(d<best){best=d;drag={f:j,i}}}));if(!drag){drag={f:-1,i:-1}}draw()};cv.onpointermove=e=>{if(!contacts.has(e.pointerId))return;e.preventDefault();let old=contacts.get(e.pointerId),p=pos(e);contacts.set(e.pointerId,p);if(contacts.size===2){let g=pair();if(gesture){zoom(g.d/gesture.d,gesture.x,gesture.y);ox+=g.x-gesture.x;oy+=g.y-gesture.y}gesture=g}else if(contacts.size===1&&drag){let dx=(p.x-old.x)/s,dy=(p.y-old.y)/s;if(drag.f<0){ox+=p.x-old.x;oy+=p.y-old.y}else{let f=frames[drag.f],a=[f[drag.i]];dx=Math.max(-Math.min(...a.map(q=>q.x)),Math.min(w-Math.max(...a.map(q=>q.x)),dx));dy=Math.max(-Math.min(...a.map(q=>q.y)),Math.min(h-Math.max(...a.map(q=>q.y)),dy));a.forEach(q=>{q.x+=dx;q.y+=dy})}}draw()};cv.onpointerup=cv.onpointercancel=e=>{contacts.delete(e.pointerId);drag=null;gesture=null;draw()};document.addEventListener('touchmove',e=>e $('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let token=++loadToken;sourceName=f.name;pageNo=1;pdf=null;$('pages').hidden=true;$('pages').replaceChildren();document.querySelectorAll('button').forEach(b=>b.disabled=true);w=h=0;frames=[];draw();$('status').textContent='読み込み中…';try{if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(!pdfLib){pdfLib=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs'}let doc=await pdfLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;if(token!==loadToken)return;pdf=doc;for(let i=1;i<=doc.numPages;i++)$('pages').add(new Option(i+' / '+doc.numPages+' ページ',i));$('pages').hidden=doc.numPages===1;await renderPage(1,token)}else await loadImage(URL.createObjectURL(f),token)}catch(err){failed(err,token)}finally{e.target.value=''}};
