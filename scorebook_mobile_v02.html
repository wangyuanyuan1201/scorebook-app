<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デジタルスコアブック 試作</title><style>body{font-family:-apple-system,sans-serif;margin:12px;background:#f6f7fa;color:#17202a}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{font-size:16px;padding:9px;border:1px solid #aab4c0;border-radius:7px;background:white}button{cursor:pointer}.primary{background:#1769aa;color:white}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.scroll{overflow:auto;background:white;border:1px solid #ccd2d8;border-radius:8px}.sheet{border-collapse:collapse;min-width:760px}.sheet th,.sheet td{border:1px solid #8995a4;padding:3px;text-align:center}.sheet th{background:#e8eef6}.name{min-width:95px}.cell{width:84px;min-width:84px;height:75px;position:relative;cursor:pointer;background:white}.cell.selected{outline:3px solid #e4a12b;outline-offset:-3px}.quad{position:absolute;font-size:12px;white-space:nowrap;max-width:36px;overflow:hidden}.tl{top:5px;left:6px}.tr{top:5px;right:6px}.bl{bottom:5px;left:6px}.br{bottom:5px;right:6px;color:#c22525}.center{top:30px;left:35px;font-weight:bold}.diamond{position:absolute;top:22px;left:30px;width:23px;height:23px;transform:rotate(45deg);border:1px solid #a5adb6;pointer-events:none}#editor{margin-top:12px;padding:12px;background:white;border:1px solid #ccd2d8;border-radius:9px}#editor label{display:block;margin:6px 0}#editor input{width:90%;max-width:260px}small{color:#596577}#photo{max-width:100%;max-height:280px;display:none;margin:10px auto} .checked{background:#e6f6e9!important} .hint{margin:10px 0;color:#596577}</style></head><body><header><h2 style="margin:0">デジタルスコアブック</h2><span>試作版 v0.2</span></header><p class="hint">枠が表示されない場合はSafariで開いてください。原本と同じ5区画に転記。横スクロールで各回を確認できます。</p><div class="toolbar"><label>回 <select id="inning"></select></label><button id="confirm">この回を確認済みにする</button><button id="export" class="primary">JSON保存</button><label>JSON読込 <input id="import" type="file" accept=".json,application/json" style="max-width:180px"></label><label>原本画像 <input id="image" type="file" accept="image/*" style="max-width:180px"></label></div><img id="photo" alt="原本画像"><div class="scroll"><table class="sheet" id="sheet"><tr><th>打順</th><th>背番号</th><th class="name">選手名</th><th>1回（1打席目）</th><th>1回（2打席目）</th></tr><tr><td>1</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>2</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>3</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>4</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>5</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>6</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>7</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>8</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr><tr><td>9</td><td>　</td><td>　</td><td class="cell"><span class="diamond"></span></td><td class="cell"><span class="diamond"></span></td></tr></table></div><section id="editor"><strong id="selection">マスを選択してください</strong><div id="fields"></div></section><p><small>右下＝打席結果、右上＝1→2塁、左上＝2→3塁、左下＝3→本塁、中央＝生還・残塁・アウト。データはこの端末のブラウザ内に一時保存されます。必ずJSON保存もしてください。</small></p><script>
const KEY='scorebook_trial_v02';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.players))data={version:1,players:Array.from({length:9},(_,i)=>({order:i+1,name:'',number:'',cells:{}})),confirmed:{}};let inning=1,selected=null;const qs=id=>document.getElementById(id);for(let i=1;i<=9;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'回';qs('inning').append(o)}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function getCell(p,i){return p.cells[i]||(p.cells[i]={tl:'',tr:'',bl:'',br:'',center:''})}function render(){qs('inning').value=inning;let h='<tr><th>打順</th><th>背番号</th><th class="name">選手名</th><th>'+inning+'回（1打席目）</th><th>'+inning+'回（2打席目）</th></tr>';data.players.forEach((p,idx)=>{h+=`<tr><td>${p.order}</td><td><input aria-label="背番号" style="width:43px" data-p="${idx}" data-k="number" value="${esc(p.number)}"></td><td><input aria-label="選手名" style="width:96px" data-p="${idx}" data-k="name" value="${esc(p.name)}"></td>`;for(let n=1;n<=2;n++){let k=inning+'-'+n,c=getCell(p,k);h+=`<td class="cell ${selected&&selected.idx===idx&&selected.k===k?'selected':''} ${data.confirmed[inning]?'checked':''}" data-cell="${idx}:${k}"><span class="diamond"></span>${['tl','tr','bl','br','center'].map(f=>`<span class="quad ${f}">${esc(c[f])}</span>`).join('')}</td>`}h+='</tr>'});qs('sheet').innerHTML=h;qs('confirm').textContent=data.confirmed[inning]?'確認済み（解除する）':'この回を確認済みにする';qs('sheet').querySelectorAll('input[data-p]').forEach(el=>el.addEventListener('change',()=>{data.players[+el.dataset.p][el.dataset.k]=el.value;save()}));qs('sheet').querySelectorAll('[data-cell]').forEach(el=>el.addEventListener('click',()=>{let [idx,k]=el.dataset.cell.split(':');selected={idx:+idx,k};render();renderEditor()}))}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function renderEditor(){if(!selected){qs('selection').textContent='マスを選択してください';qs('fields').innerHTML='';return}let p=data.players[selected.idx],c=getCell(p,selected.k);qs('selection').textContent=`${p.order}番 ${p.name||'選手未入力'} / ${selected.k}回・打席`;let names={br:'右下：打席結果',tr:'右上：1→2塁',tl:'左上：2→3塁',bl:'左下：3→本塁',center:'中央：生還・残塁・アウト'};qs('fields').innerHTML=Object.entries(names).map(([k,v])=>`<label>${v} <input data-field="${k}" value="${esc(c[k])}" placeholder="記号を入力"></label>`).join('');qs('fields').querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{c[el.dataset.field]=el.value;save();let cell=qs('sheet').querySelector(`[data-cell="${selected.idx}:${selected.k}"] .${el.dataset.field}`);if(cell)cell.textContent=el.value}))}qs('inning').onchange=e=>{inning=+e.target.value;selected=null;render();renderEditor()};qs('confirm').onclick=()=>{data.confirmed[inning]=!data.confirmed[inning];save();render()};qs('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scorebook_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};qs('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.players))throw Error('players配列がありません');data=v;save();selected=null;render();renderEditor();alert('読み込みました')}catch(err){alert('読込エラー: '+err.message)}};qs('image').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);qs('photo').src=url;qs('photo').style.display='block'};render();
</script></body></html>
