<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スコアブック v0.3</title><style>
*{box-sizing:border-box}body{margin:8px;font:15px system-ui;color:#20372c;background:#f6f7f3}button,input,select{font:inherit}button{padding:9px;border:1px solid #87988d;border-radius:6px;background:white}header{display:flex;flex-wrap:wrap;gap:6px;align-items:center}h2{margin:5px 0}input{min-width:0;width:100%;border:1px solid #aab4aa;padding:5px;background:transparent}#sheet{overflow:auto;max-height:65vh;background:white;border:1px solid #45634f}table{border-collapse:collapse;table-layout:fixed;width:max-content}td,th{border:1px solid #71877a;padding:0;text-align:center}th{background:#dbe4d8;position:sticky;top:0;z-index:3;height:28px}.order{background:#41674e;color:white;width:25px}.pos{width:36px}.name{width:85px}.num{width:32px}.cell{width:76px;height:66px;position:relative;cursor:pointer;background:white}.diamond{position:absolute;left:27px;top:21px;width:23px;height:23px;border:1px solid #a5b2a6;transform:rotate(45deg)}.mark{position:absolute;font-size:13px;white-space:pre;max-width:29px;overflow:hidden}.ul{left:15px;top:3px}.ur{right:3px;top:3px}.ll{left:15px;bottom:3px}.lr{right:3px;bottom:3px}.mid{left:29px;top:24px}.pitch{left:1px;top:2px;width:12px;white-space:pre-wrap;font-size:10px}.sub input{height:22px;font-size:12px;padding:1px}.sub{display:flex;align-items:center}.sub span{width:22px;font-size:10px}.done{background:#d4ebd7}dialog{width:min(95vw,420px);border:1px solid #526b5a;border-radius:12px;padding:14px}dialog::backdrop{background:#0007}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editgrid label{font-size:13px}.editgrid select{width:100%}#photo{max-width:100%;display:none}#status{font-size:12px} .tools{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
</style><h2>デジタルスコア v0.3</h2><header><input id="date" type="date" style="width:145px"><input id="opponent" placeholder="対戦相手" style="width:140px"></header><div class="tools"><button id="all">全体</button><select id="focus"><option value="0">回を選択</option></select><button id="confirm">この回を確定</button><button id="export">JSON保存</button><button id="import">JSON読込</button><button id="pick">原本画像</button></div><input type="file" id="file" accept=".json" hidden><input type="file" id="image" accept="image/*" hidden><img id="photo" alt="原本"><div id="status"></div><div id="sheet"><table id="table"></table></div><dialog id="dlg"><h3 id="editTitle"></h3><div class="editgrid" id="fields"></div><div class="tools"><button id="save">保存</button><button id="cancel">取消</button><button id="clear">マスを消去</button></div></dialog><script>
const $=id=>document.getElementById(id), keys=['ul','ur','ll','lr','mid','pitch'], labels=['左上 2→3塁','右上 1→2塁','左下 3→本塁','右下 打席結果','中央 生還・残塁・アウト','投球記録'];const fresh=()=>({version:3,date:'',opponent:'',players:Array.from({length:10},()=>Array.from({length:3},()=>({name:'',num:'',pos:''}))),innings:Array.from({length:9},(_,i)=>String(i+1)),cells:{},confirmed:[]});let d=fresh(),active=null;try{let x=localStorage.getItem('scorebook_v03');if(x)d=JSON.parse(x)}catch(e){}function persist(){try{localStorage.setItem('scorebook_v03',JSON.stringify(d));$('status').textContent='端末内に保存済み'}catch(e){$('status').textContent='自動保存不可：JSON保存してください'}}function el(t,c,txt){let n=document.createElement(t);if(c)n.className=c;if(txt!==undefined)n.textContent=txt;return n}function inp(v,fn){let n=el('input');n.value=v||'';n.onchange=()=>{fn(n.value);persist()};return n}for(let i=1;i<=9;i++)$('focus').add(new Option(i+'列目',i));function render(){let t=$('table');t.replaceChildren();let h=el('tr');['打順','守備','選手名','背番号'].forEach((s,i)=>h.append(el('th',['order','pos','name','num'][i],s)));let f=+$('focus').value,cols=f?[f-1]:Array.from({length:9},(_,i)=>i);for(let c of cols){let th=el('th',d.confirmed.includes(c)?'done':'');th.append(inp(d.innings[c],v=>d.innings[c]=v));h.append(th)}t.append(h);for(let r=0;r<10;r++){let tr=el('tr');let o=el('td','order');[r+1,r+11,r+21].forEach(n=>o.append(el('div','sub',n)));tr.append(o);for(let k of ['pos','name','num']){let td=el('td',k);for(let p of d.players[r]){let sub=el('div','sub');sub.append(inp(p[k],v=>p[k]=v));td.append(sub)}tr.append(td)}for(let c of cols){let id=r+':'+c,td=el('td','cell');td.append(el('div','diamond'));for(let k of keys){let v=d.cells[id]?.[k];let m=el('span','mark '+k,v?.text||'');m.style.color=v?.color||'black';td.append(m)}td.onclick=()=>edit(r,c);tr.append(td)}t.append(tr)}}function edit(r,c){active=r+':'+c;$('editTitle').textContent=(r+1)+'番・'+d.innings[c]+'回（'+(c+1)+'列）';let box=$('fields');box.replaceChildren();keys.forEach((k,i)=>{let l=el('label','',labels[i]);let a=el('input');a.id='e_'+k;a.value=d.cells[active]?.[k]?.text||'';let s=el('select');s.id='c_'+k;[['black','黒'],['red','赤'],['blue','青']].forEach(([v,n])=>s.add(new Option(n,v)));s.value=d.cells[active]?.[k]?.color||'black';l.append(a,s);box.append(l)});$('dlg').showModal()}$('save').onclick=()=>{let v={};for(let k of keys)v[k]={text:$('e_'+k).value,color:$('c_'+k).value};d.cells[active]=v;d.confirmed=d.confirmed.filter(c=>c!==+active.split(':')[1]);persist();$('dlg').close();render()};$('cancel').onclick=()=>$('dlg').close();$('clear').onclick=()=>{delete d.cells[active];d.confirmed=d.confirmed.filter(c=>c!==+active.split(':')[1]);persist();$('dlg').close();render()};$('focus').onchange=render;$('all').onclick=()=>{$('focus').value=0;render()};$('confirm').onclick=()=>{let c=+$('focus').value-1;if(c<0){alert('回の列を選んでください');return}if(!d.confirmed.includes(c))d.confirmed.push(c);persist();render()};function meta(){for(let k of ['date','opponent']){$(k).value=d[k];$(k).onchange=()=>{d[k]=$(k).value;persist()}}} $('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='scorebook_v03.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==3||x.players?.length!==10||x.innings?.length!==9||!x.cells||!Array.isArray(x.confirmed))throw Error();if(!confirm('現在のデータを置き換えますか？'))return;d=x;meta();persist();render()}catch(e){alert('v0.3のJSONを選んでください')}finally{$('file').value=''}};$('pick').onclick=()=>$('image').click();$('image').onchange=e=>{if(e.target.files[0]){$('photo').src=URL.createObjectURL(e.target.files[0]);$('photo').style.display='block'}};meta();render();</script></html>
