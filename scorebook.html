function jumpStep(index){
 if(!stepAvailability()[index])return;
 if(index===4){exportResult();return}
 if(index===3 && !R.hidden && resumeView.type==='cell')return;
 if(!R.hidden && resumeView.type==='cell' && activeDraft){
   parkedCell={side,row:resumeView.row,col:resumeView.col,draft:structuredClone(activeDraft)};
   activeDraft=null;
 }
 if(index===0){R.hidden=true;resumeView={type:'position'}}
 else if(index===3){showReview()}
 else{structurePhase=index;pick=null;showStructure()}
 updateSteps();scheduleSave();
}
['①位置','②打席','③交代','④詳細','⑤出力'].forEach((label,index)=>{
 btn($('steps'),label,()=>jumpStep(index));
});
new MutationObserver(updateSteps).observe(document.body,{childList:true,subtree:true,
 attributes:true,attributeFilter:['hidden']});
updateSteps();
dbReady.then(async()=>{let all=await dbOp('readonly',o=>o.getAll());if(all.length&&!gameKey)await listGames()}).catch(saveError);
</script></html>
