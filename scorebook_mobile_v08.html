<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スコアブック v0.8</title><style>

const $=id=>document.getElementById(id), keys=['ul','ur','ll','lr','mid','pitch'], labels=['左上 2→3塁','右上 1→2塁','左下 3→本塁','右下 打席結果','中央 生還・残塁・アウト','投球記録'];const fresh=()=>({version:3,date:'',opponent:'',players:Array.from({length:10},()=>Array.from({length:3},()=>({name:'',num:'',pos:''}))),innings:Array.from({length:9},(_,i)=>String(i+1)),cells:{},confirmed:[]});let d=fresh(),active=null,selected='lr';try{let x=localStorage.getItem('scorebook_v03');if(x)d=JSON.parse(x)}catch(e){}function persist(){try{localStorage.setItem('scorebook_v03',JSON.stringify(d));$('status').textContent='端末内に保存済み'}catch(e){$('status').textContent='自動保存不可：JSON保存してください'}}function el(t,c,txt){let n=document.createElement(t);if(c)n.className=c;if(txt!==undefined)n.textContent=txt;return n}function inp(v,fn){let n=el('input');n.value=v||'';n.onchange=()=>{fn(n.value);persist()};return n}for(let i=1;i<=9;i++)$('focus').add(new Option(i+'列目',i));function render(){let t=$('table');t.replaceChildren();let h=el('tr');['打順','守備','選手名','背番号'].forEach((s,i)=>h.append(el('th',['order','pos','name','num'][i],s)));let f=+$('focus').value,cols=f?[f-1]:Array.from({length:9},(_,i)=>i);for(let c of cols){let th=el('th',d.confirmed.includes(c)?'done':'');th.style.width="76px";th.append(inp(d.innings[c],v=>d.innings[c]=v));h.append(th)}t.append(h);for(let r=0;r<10;r++){let tr=el('tr');let o=el('td','order');[r+1,r+11,r+21].forEach(n=>o.append(el('div','sub',n)));tr.append(o);for(let k of ['pos','name','num']){let td=el('td',k);for(let p of d.players[r]){let sub=el('div','sub');sub.append(inp(p[k],v=>p[k]=v));td.append(sub)}tr.append(td)}for(let c of cols){let id=r+':'+c,td=el('td','cell');td.append(el('div','diamond'));for(let k of keys){let v=d.cells[id]?.[k];let m=el('span','mark '+k,v?.text||'');m.style.color=v?.color||'black';td.append(m)}td.onclick=()=>edit(r,c);tr.append(td)}t.append(tr)}}function edit(r,c){active=r+':'+c;$('editTitle').textContent=(r+1)+'番 '+(d.players[r][0].name||'')+'・'+d.innings[c]+'回（'+(c+1)+'列）';let box=$('fields');box.replaceChildren();keys.forEach((k,i)=>{let l=el('label','',labels[i]);let a=el('input');a.id='e_'+k;a.value=d.cells[active]?.[k]?.text||'';let s=el('select');s.id='c_'+k;[['black','黒'],['red','赤'],['blue','青']].forEach(([v,n])=>s.add(new Option(n,v)));s.value=d.cells[active]?.[k]?.color||'black';l.append(a,s);l.onclick=()=>chooseField(k);a.onfocus=()=>chooseField(k);a.oninput=updatePreview;s.onchange=updatePreview;box.append(l)});showCrop(r,c);chooseField('lr');$('dlg').showModal();$('noFocus').focus({preventScroll:true})}$('save').onclick=()=>{let v={};for(let k of keys)v[k]={text:$('e_'+k).value,color:$('c_'+k).value};d.cells[active]=v;d.confirmed=d.confirmed.filter(c=>c!==+active.split(':')[1]);persist();$('dlg').close();render()};$('cancel').onclick=()=>$('dlg').close();$('clear').onclick=()=>{delete d.cells[active];d.confirmed=d.confirmed.filter(c=>c!==+active.split(':')[1]);persist();$('dlg').close();render()};$('focus').onchange=render;$('all').onclick=()=>{$('focus').value=0;render()};$('confirm').onclick=()=>{let c=+$('focus').value-1;if(c<0){alert('回の列を選んでください');return}if(!d.confirmed.includes(c))d.confirmed.push(c);persist();render()};function meta(){for(let k of ['date','opponent']){$(k).value=d[k];$(k).onchange=()=>{d[k]=$(k).value;persist()}}} $('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='scorebook_v08.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==3||x.players?.length!==10||x.innings?.length!==9||!x.cells||!Array.isArray(x.confirmed))throw Error();if(!confirm('現在のデータを置き換えますか？'))return;d=x;meta();persist();render()}catch(e){alert('v0.8のJSONを選んでください')}finally{$('file').value=''}};$('pick').onclick=()=>$('image').click();let original=new Image(), points=null, draft=nu let iw=480,ih=480,scale=1,ox=0,oy=0,zoom=1,contacts=new Map(),gesture=null;const loupe=$('loupe');
function fitView(){zoom=1;scale=Math.min(ac.width/iw,ac.height/ih);ox=(ac.width-iw*scale)/2;oy=(ac.height-ih*scale)/2;drawAlign()}

function drawAlign(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ac.width,ac.height);ctx.setTransform(scale,0,0,scale,ox,oy);ctx.drawImage(original,0,0,iw,ih);ctx.lineWidth=1.5/scale;for(let i=0;i<=10;i++){let a=project(draft,0,i/10),b=project(draft,1,i/10);ctx.strokeStyle='#0088ff';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let i=0;i<=9;i++){let a=project(draft,i/9,0),b=project(draft,i/9,1);ctx.strokeStyle='#ff3333';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.setTransform(1,0,0,1,0,0);draft.forEach((p,i)=>{let x=p.x*scale+ox,y=p.y*scale+oy;ctx.fillStyle='#007aff';ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.font='bold 14px sans-serif';ctx.fillText(i+1,x-4,y+5)});if(drag>=0){let p=draft[drag],l=loupe.getContext('2d'),z=3*scale;loupe.style.display='block';loupe.style.top=p.y*scale+oy<130?'auto':'8px';loupe.style.bottom=p.y*scale+oy<130?'8px':'auto';l.clearRect(0,0,220,220);l.drawImage(original,110-p.x*z,110-p.y*z,iw*z,ih*z);l.strokeStyle='#ff3333';l.lineWidth=2;l.beginPath();l.moveTo(110,0);l.lineTo(110,220);l.moveTo(0,110);l.lineTo(220,110);l.stroke()}else loupe.style.display='none'}
function project(p,u,v){let [a,b,c,d]=p,dx1=b.x-c.x,dx2=d.x-c.x,dx3=a.x-b.x+c.x-d.x,dy1=b.y-c.y,dy2=d.y-c.y,dy3=a.y-b.y+c.y-d.y,det=dx1*dy2-dx2*dy1;let g=det?(dx3*dy2-dx2*dy3)/det:0,h=det?(dx1*dy3-dx3*dy1)/det:0,z=1+g*u+h*v;return {x:(a.x+(b.x-a.x+g*b.x)*u+(d.x-a.x+h*d.x)*v)/z,y:(a.y+(b.y-a.y+g*b.y)*u+(d.y-a.y+h*d.y)*v)/z}}
let savedScroll=0;function lockPage(){savedScroll=window.scrollY;document.documentElement.classList.add('aligning');document.body.classList.add('aligning');document.body.style.top=-savedScroll+'px'}function unlockPage(){document.documentElement.classList.remove('aligning');document.body.classList.remove('aligning');document.body.style.top='';window.scrollTo(0,savedScroll)}function stopNative(e){if($('alignDlg').open&&e.cancelable)e.preventDefault()}document.addEventListener('touchmove',stopNative,{passive:false,capture:true});document.addEventListener('gesturestart',stopNative,{passive:false,capture:true});document.addEventListener('gesturechange',stopNative,{passive:false,capture:true});document.addEventListener('wheel',stopNative,{passive:false,capture:true});
function openAlign(){draft=points?points.map(p=>({...p})):[{x:iw*.35,y:ih*.55},{x:iw*.9,y:ih*.55},{x:iw*.9,y:ih*.93},{x:iw*.35,y:ih*.93}];lockPage();$('alignDlg').showModal();resizeAlign()}
$('alignDlg').addEventListener('close',()=>{unlockPage();contacts.clear();drag=-1;gesture=null});window.addEventListener('resize',resizeAlign);

$('zoomIn').onclick=()=>zoomAt(1.5,ac.width/2,ac.height/2);$('zoomOut').onclick=()=>zoomAt(1/1.5,ac.width/2,ac.height/2);$('fit').onclick=fitView;

function chooseField(k){selected=k;[...$('fields').children].forEach((l,i)=>l.classList.toggle('selected',keys[i]===k))}function updatePreview(){for(let k of keys){let m=$('preview').querySelector('.mark.'+k);if(m){m.textContent=$('e_'+k).value;m.style.color=$('c_'+k).value}}}for(let token of ['1','2','3','4','5','6','7','8','9','-','K','Ⓚ','B','DB','FC','S','Ⅰ','Ⅱ','Ⅲ','○','●','赤','青','黒','⌫','消去']){let b=el('button','',token);b.type='button';b.onclick=()=>{let a=$('e_'+selected);if(['赤','青','黒'].includes(token))$('c_'+selected).value=({赤:'red',青:'blue',黒:'black'})[token];else if(token==='消去')a.value='';else if(token==='⌫')a.value=Array.from(a.value).slice(0,-1).join('');else a.value+=token;updatePreview()};$('pad').append(b)}function showReference(r,c){let cv=$('refMap');$('refLabel').textContent=`原本参照：打順 ${r+1}・列 ${c+1}（黄色枠）`;cv.width=480;cv.height=Math.max(1,Math.round(480*ih/iw));let x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);if(!points)return;let sx=cv.width/iw,sy=cv.height/ih;x.drawImage(original,0,0,cv.width,cv.height);function line(a,b,color){x.strokeStyle=color;x.lineWidth=1;x.beginPath();x.moveTo(a.x*sx,a.y*sy);x.lineTo(b.x*sx,b.y*sy);x.stroke()}for(let i=0;i<=10;i++)line(project(points,0,i/10),project(points,1,i/10),'#0088ff');for(let i=0;i<=9;i++)line(project(points,i/9,0),project(points,i/9,1),'#ff3333');let q=[[c,r],[c+1,r],[c+1,r+1],[c,r+1]].map(([a,b])=>project(points,a/9,b/10));x.beginPath();q.forEach((p,i)=>i?x.lineTo(p.x*sx,p.y*sy):x.moveTo(p.x*sx,p.y*sy));x.closePath();x.fillStyle='rgba(255,230,0,.25)';x.fill();x.strokeStyle='#ffdf00';x.lineWidth=3;x.stroke()}
function showCrop(r,c){showReference(r,c);let cv=$('crop');cv.width=240;cv.height=240;let x=cv.getContext('2d');x.clearRect(0,0,240,240);if(points){let src=document.createElement('canvas');src.width=original.width;src.height=original.height;let sc=src.getContext('2d');sc.drawImage(original,0,0);let pixels=sc.getImageData(0,0,src.width,src.height).data,out=x.createImageData(240,240);for(let j=0;j<240;j++)for(let i=0;i<240;i++){let p=project(points,(c+i/239)/9,(r+j/239)/10),sx=Math.max(0,Math.min(src.width-1,Math.round(p.x*src.width/iw))),sy=Math.max(0,Math.min(src.height-1,Math.round(p.y*src.height/ih))),a=(sy*src.width+sx)*4,b=(j*240+i)*4;out.data.set(pixels.subarray(a,a+4),b)}x.putImageData(out,0,0)}else{x.font='16px sans-serif';x.fillText('原本画像を設定してください',5,35)}let v=$('preview');v.replaceChildren();let cell=el('div','cell');cell.style.width='100%';cell.style.height='110px';cell.append(el('div','diamond'));for(let k of keys){let m=el('span','mark '+k,d.cells[r+':'+c]?.[k]?.text||'');m.style.color=d.cells[r+':'+c]?.[k]?.color||'black';cell.append(m)}v.append(cell)}
